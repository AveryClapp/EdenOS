<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark background -->
  <rect width="32" height="32" rx="4" fill="#02080f"/>
  <!-- Outer border ring -->
  <rect x="2" y="2" width="28" height="28" rx="3" stroke="#00badc" stroke-width="0.5" stroke-opacity="0.4"/>
  <!-- Corner brackets TL -->
  <path d="M4 8 L4 4 L8 4" stroke="#00badc" stroke-width="1" stroke-linecap="square" stroke-opacity="0.8"/>
  <!-- Corner brackets BR -->
  <path d="M28 24 L28 28 L24 28" stroke="#00badc" stroke-width="1" stroke-linecap="square" stroke-opacity="0.8"/>
  <!-- E letterform — stylized, monospace feel -->
  <rect x="10" y="9" width="12" height="1.5" rx="0.5" fill="#00badc"/>
  <rect x="10" y="15.25" width="9" height="1.5" rx="0.5" fill="#00badc" opacity="0.85"/>
  <rect x="10" y="21.5" width="12" height="1.5" rx="0.5" fill="#00badc"/>
  <rect x="10" y="9" width="1.5" height="14" rx="0.5" fill="#00badc"/>
  <!-- Subtle center glow -->
  <ellipse cx="16" cy="16" rx="8" ry="6" fill="#00badc" fill-opacity="0.04"/>
</svg>
